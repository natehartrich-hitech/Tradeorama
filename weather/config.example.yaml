# Copy to config.yaml and edit. config.yaml is git-ignored.

# NWS requires a User-Agent that identifies you, with contact info.
# https://www.weather.gov/documentation/services-web-api
nws:
  user_agent: "wxbrackets (you@example.com)"   # REQUIRED: put your own email or site here
  min_interval_sec: 1.0                        # politeness delay between NWS requests

open_meteo:
  # Free tier is non-commercial only. If you upgrade, switch to the customer
  # endpoint and set your key, e.g.
  #   base_url: https://customer-ensemble-api.open-meteo.com/v1/ensemble
  #   api_key: "..."
  #   forecast_url: https://customer-api.open-meteo.com/v1/forecast
  base_url: https://ensemble-api.open-meteo.com/v1/ensemble   # ensemble models
  forecast_url: https://api.open-meteo.com/v1/forecast        # deterministic models (HRRR)
  api_key: null
  min_interval_sec: 0.5

# Ensemble models to pool. `id` is Open-Meteo's `models` value. These IDs are
# best-effort: run `python -m wxbrackets check-models --station CHI` to confirm
# each returns the expected member count, and fix any that don't.
# Weights are per MODEL (each model's members share its weight equally).
# source: ensemble (default) uses the Ensemble API; source: forecast uses the regular
# Forecast API, where a model is one deterministic run counted as a single member.
models:
  - id: ecmwf_ifs025
    name: ECMWF IFS 0.25° ensemble
    weight: 1.0
    expected_members: 51
  - id: gfs025
    name: GFS ensemble 0.25°
    weight: 1.0
    expected_members: 31
  - id: icon_seamless
    name: DWD ICON EPS
    weight: 1.0
    expected_members: 40
  - id: gem_global
    name: GEM global ensemble
    weight: 1.0
    expected_members: 21
  # NOAA HRRR, 3 km, updated hourly. Runs reach 18 hours ahead (48 hours for the
  # 00/06/12/18 UTC runs), so it only covers today and sometimes tomorrow; on other
  # days it's skipped automatically. As ONE run, it gets a smaller weight than a
  # whole ensemble so it can't create a lump in the distribution by itself.
  - id: ncep_hrrr_conus
    name: NOAA HRRR (deterministic)
    source: forecast
    weight: 0.5
    expected_members: 1
  # NOAA RRFS (3 km, operational from November 2026), read straight from NOAA's AWS
  # bucket. The deterministic run includes hourly maximum temperature (TMAX), which
  # catches peaks between hours. Covers up to 84 hours ahead from 00/06/12/18Z runs.
  # Each forecast downloads one ~1.7 MB message per hour of the day (24); values are
  # cached in the database, so repeat runs on the same cycle are quick.
  - id: rrfs
    name: NOAA RRFS (deterministic)
    source: rrfs
    weight: 0.5
    expected_members: 1
  # REFS: the RRFS ensemble, 5 members, up to 60 hours ahead. About 125 messages
  # (~210 MB) per forecast the first time; set weight: 0 to turn it off.
  - id: refs
    name: NOAA REFS (RRFS ensemble)
    source: refs
    weight: 1.0
    expected_members: 5
    members: [1, 2, 3, 4, 5]

distribution:
  bias_f: 0.0            # added to every member max (positive = warmer). Set from `calibration`.
  spread_inflation: 1.3  # scales member deviations from the pooled mean (>1 widens)
  bandwidth_f: auto      # kernel width in °F, or "auto" (weighted Silverman rule)
  min_valid_hours: 8     # a member needs this many non-missing hourly values in the climate day
  edge_tolerance_hours: 3  # ...and data within this many hours of both ends of the day
  obs_tolerance_f: 0.5   # same-day conditioning: high must be >= observed max minus this

rrfs:
  base_url: https://noaa-rrfs-ops-pds.s3.amazonaws.com

# Market brackets used when --brackets isn't given (upper edges, inclusive).
default_brackets: [45, 47, 49, 51, 53, 55]

database: wxbrackets.db

# Stations. VERIFY which station each market settles on before trusting any number:
